    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta
          name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
        />
        <meta
          http-equiv="X-UA-Compatible"
          content="ie=edge"
        />
        <title>Moyo header</title>
        <link
          rel="stylesheet"
          href="./style.css"
        />
      </head>
      <body>
        <header class="header">
          <div class="header__logo">
            <img
              class="header__logo-img"
              src="./images/logo.png"
              alt="Moyo Logo"
            />
          </div>
          <nav class="header__nav nav">
            <ul class="header__nav-list nav-list">
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#apple"
                >
                  Apple
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#samsung"
                >
                  Samsung
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#smartphones"
                >
                  Smartphones
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#laptops&computers"
                >
                  Laptops & Computers
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#gadgets"
                >
                  Gadgets
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#tablets"
                >
                  Tablets
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#photo"
                >
                  Photo
                </a>
              </li>
              <li class="nav-list__item">
                <a
                  class="nav-list__link"
                  href="#video"
                >
                  Video
                </a>
              </li>
            </ul>
          </nav>
        </header>
      </body>
    </html>
  </body>
</html>
